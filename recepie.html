<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thindi Katte Recipe</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --panel: #fffaf0;
      --text: #25170f;
      --muted: #7a6a5d;
      --accent: #a34221;
      --border: #e3d6c2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(163, 66, 33, 0.14), transparent 32rem),
        linear-gradient(135deg, #fdf8ec, var(--bg));
    }

    .gate,
    .content {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 250, 240, 0.92);
      box-shadow: 0 18px 45px rgba(37, 23, 15, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      line-height: 1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    .error {
      min-height: 1.3em;
      margin-top: 10px;
      color: #b91c1c;
      font-size: 0.95rem;
    }

    .content {
      display: none;
    }

    .content.visible {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <section id="gate" class="gate">
      <h1>Thindi Katte Recipe</h1>
      <p>Enter the password to view this page.</p>
      <form id="passwordForm">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" autofocus>
        <button type="submit">Open Recipe</button>
        <div id="error" class="error" aria-live="polite"></div>
      </form>
    </section>

    <section id="content" class="content">
      <h1>Thindi Katte Recipe</h1>
      <p>Recipe content will be added here later.</p>
    </section>
  </main>

  <script>
    (() => {
      const password = "2026tk";
      const form = document.getElementById("passwordForm");
      const input = document.getElementById("password");
      const gate = document.getElementById("gate");
      const content = document.getElementById("content");
      const error = document.getElementById("error");

      form.addEventListener("submit", event => {
        event.preventDefault();

        if (input.value === password) {
          gate.style.display = "none";
          content.classList.add("visible");
          return;
        }

        error.textContent = "Incorrect password.";
        input.value = "";
        input.focus();
      });
    })();
  </script>
</body>
</html>
